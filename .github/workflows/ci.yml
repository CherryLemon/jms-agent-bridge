name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  remote-probe:
    name: Remote filesystem probe (Python 3.8)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      # Target-side probe is stdlib-only; server dependencies require Python 3.10+.
      - run: python -I -S tests/remote/test_filesystem_compat.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # `scripts/` is small but not disposable: mcp_call.py speaks the MCP wire
      # protocol for the acceptance pass and verify_support.py builds an inventory
      # from its results, so a typo there breaks onboarding rather than a test.
      - name: Lint
        run: ruff check src tests scripts

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the tomllib boundary — config.py uses stdlib tomllib from 3.11 and
        # the tomli fallback only on 3.10, so testing 3.10 and 3.12 alone left the
        # branch switch itself unverified. 3.13 covers the upper advertised end.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The coverage floor (pyproject.toml [tool.coverage.report]) rides along with
      # the default addopts, so a run that drops below it fails here.
      - name: Test
        run: pytest -q
