[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jms-agent-bridge"
version = "0.2.2"
description = "MCP bridge for JumpServer: drive heterogeneous GPU/NPU clusters from Claude Code, Codex or dsh over the audited bastion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "lvyufeng" }]
keywords = ["jumpserver", "mcp", "bastion", "torch", "federated-learning", "ascend", "cuda"]
dependencies = [
    # Major-version caps: the code depends on mcp 2.x's MCPServer/ToolError surface and
    # on httpx's client API specifically, so a future major is an explicit bump, not a
    # silent `pip install` surprise.
    "mcp>=2.0,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    # tomllib is stdlib only from 3.11; config.py falls back to tomli on 3.10.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Native connections and validation for the optional four-tool resident service.
compact = ["asyncssh>=2.24,<3", "jsonschema>=4.20,<5", "uvicorn>=0.30,<1"]
# Optional: keep a saved JumpServer password in the OS keyring rather than a 0600 file.
# Deliberately an extra — a hard dependency would change the clone-and-run install for
# everyone to spare `login --save-password` a plaintext fallback it already handles.
keyring = ["keyring>=24.0"]
# Pinned exactly: these define the test environment, so a run must mean the same thing
# on every machine and on CI. Runtime deps above stay on ranges for downstream users.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
    "asyncssh==2.24.1",
    "jsonschema==4.26.0",
]

[project.scripts]
jms-bridge = "jms_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/lvyufeng/jms-agent-bridge"

[tool.hatch.build.targets.wheel]
packages = ["src/jms_bridge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage is on by default so a local `pytest` reports what CI gates on; the
# threshold lives in [tool.coverage.report] below.
addopts = "--cov=jms_bridge --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["jms_bridge"]

[tool.coverage.report]
# A floor, not a goal: this is where the suite stands today (~77%), set a couple of
# points low so ordinary churn does not trip it. It exists to fail a change that lands
# a large block of untested code, not to demand a number.
fail_under = 75
show_missing = true
# `__main__` is four lines reaching the CLI, exercised by subprocess in the stdio
# tests rather than imported; counting it only dilutes the signal.
omit = ["*/jms_bridge/__main__.py"]
